<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
body { font-family: "Segoe UI", system-ui, sans-serif; color: #17352c; background: #f7f2e8; }
.canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; padding: 72px; }
.orb { position: absolute; right: -80px; top: -100px; width: 560px; height: 560px; border-radius: 50%; background: #f1c453; }
.ring { position: absolute; right: 90px; bottom: -210px; width: 520px; height: 520px; border: 2px solid rgba(23,53,44,.2); border-radius: 50%; }
.brand { position: relative; display: flex; gap: 16px; align-items: center; font-weight: 800; font-size: 26px; letter-spacing: -.04em; }
.logo { display: grid; width: 58px; height: 58px; place-items: center; border-radius: 17px; color: white; background: #2f7a57; font-size: 32px; }
.eyebrow { position: relative; margin-top: 92px; color: #2f7a57; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
h1 { position: relative; width: 760px; margin: 18px 0 20px; font-size: 82px; line-height: .95; letter-spacing: -.065em; }
h1 span { color: #2f7a57; }
p { position: relative; width: 650px; margin: 0; color: #315a4d; font-size: 25px; line-height: 1.35; }
.dog { position: absolute; right: 125px; bottom: 55px; width: 260px; height: 310px; }
.dog .body { position: absolute; right: 25px; bottom: 0; width: 180px; height: 220px; border-radius: 90px 90px 60px 60px; background: #d49252; }
.dog .head { position: absolute; right: 35px; bottom: 155px; width: 150px; height: 140px; border-radius: 50%; background: #e3ad6e; }
.dog .ear { position: absolute; bottom: 190px; width: 55px; height: 85px; border-radius: 50%; background: #aa6335; }
.dog .ear.left { right: 145px; transform: rotate(-22deg); }
.dog .ear.right { right: 20px; transform: rotate(22deg); }
.dog .eye { position: absolute; bottom: 235px; width: 12px; height: 12px; border-radius: 50%; background: #17352c; }
.dog .eye.left { right: 108px; }
.dog .eye.right { right: 65px; }
.dog .nose { position: absolute; right: 78px; bottom: 208px; width: 28px; height: 20px; border-radius: 50%; background: #17352c; }
.dog .collar { position: absolute; right: 40px; bottom: 160px; width: 140px; height: 24px; border-radius: 10px; background: #e87351; }
.card { position: absolute; left: 72px; bottom: 54px; display: flex; gap: 13px; align-items: center; padding: 16px 20px; border-radius: 18px; background: #fffdfa; box-shadow: 0 20px 45px rgba(23,53,44,.14); font-size: 18px; font-weight: 700; }
.check { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; color: white; background: #2f7a57; }
</style>
</head>
<body>
  <main class="canvas">
    <div class="orb"></div><div class="ring"></div>
    <div class="brand"><span class="logo">⌁</span><span>PawPath HOME</span></div>
    <div class="eyebrow">Positive training for real homes</div>
    <h1>Small dog.<br><span>Big progress.</span></h1>
    <p>Step-by-step, force-free training for small and medium dogs.</p>
    <div class="card"><span class="check">✓</span>5–10 minute home sessions</div>
    <div class="dog"><span class="ear left"></span><span class="ear right"></span><span class="body"></span><span class="head"></span><span class="eye left"></span><span class="eye right"></span><span class="nose"></span><span class="collar"></span></div>
  </main>
</body>
</html>
